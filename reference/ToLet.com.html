<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ToLet.com</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap">
<style>
/* Layout concept: editorial marketplace. Soft emerald canvas, arched hero photo, search card overlapping the fold, calm white cards. Dashboards share tokens; admin gets an ink-navy rail. */
:root{--bg:#fff;--bg2:#F7F9F8;--soft:#EAF5F0;--fg:#17221D;--mut:#64716A;--line:#E3E9E5;--pri:#087F5B;--pri-h:#066A4C;--pri-t:#087F5B;--on-pri:#fff;--card:#fff;--ok:#1A7A43;--ok-bg:#E2F4E8;--warn:#8A5700;--warn-bg:#FFF2D2;--err:#B3261E;--err-bg:#FDE8E6;--info:#1E5FA8;--info-bg:#E4EEFA;--shadow:0 1px 2px rgba(23,34,29,.05),0 10px 28px -14px rgba(23,34,29,.2);--ink:#0E2A20;--adm:#14213D;--adm-a:#F5B83D;--ff:'Inter','Noto Sans Bengali',system-ui,-apple-system,'Segoe UI',sans-serif;--fb:'Noto Sans Bengali','Inter',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1411;--bg2:#121B17;--soft:#15302A;--fg:#E7EFEB;--mut:#94A59C;--line:#26332C;--pri:#0B8F69;--pri-h:#0FA177;--pri-t:#4FD1A5;--card:#141E19;--ok:#6FD39A;--ok-bg:#12301F;--warn:#F0B84A;--warn-bg:#352A10;--err:#FF8A80;--err-bg:#3A1816;--info:#8DBCF2;--info-bg:#13273E;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);--ink:#071A13;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0D1411;--bg2:#121B17;--soft:#15302A;--fg:#E7EFEB;--mut:#94A59C;--line:#26332C;--pri:#0B8F69;--pri-h:#0FA177;--pri-t:#4FD1A5;--card:#141E19;--ok:#6FD39A;--ok-bg:#12301F;--warn:#F0B84A;--warn-bg:#352A10;--err:#FF8A80;--err-bg:#3A1816;--info:#8DBCF2;--info-bg:#13273E;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.65);--ink:#071A13;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--fg);font-family:var(--ff);font-size:15px;line-height:1.65;-webkit-text-size-adjust:100%;overflow-x:hidden}
h1,h2,h3,h4{margin:0;line-height:1.3;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
img{display:block}
.ic{flex:none}
:focus-visible{outline:2.5px solid var(--pri-t);outline-offset:2px;border-radius:6px}
.wrap{max-width:1240px;margin:0 auto;padding-inline:20px}
.mut{color:var(--mut)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.num{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14.5px;background:var(--bg2);transition:background .15s,border-color .15s,transform .1s;white-space:nowrap;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--pri);color:var(--on-pri)}
.btn.pri:hover{background:var(--pri-h)}
.btn.line{background:transparent;border-color:var(--line)}
.btn.line:hover{border-color:var(--pri-t);color:var(--pri-t)}
.btn.ghost{background:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--err-bg);color:var(--err)}
.btn.sm{min-height:36px;padding:0 14px;font-size:13.5px;border-radius:8px}
.btn.lg{min-height:52px;padding:0 28px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn.white{background:#fff;color:#0A5A42}
.btn.white:hover{background:#EAF5F0}
.ibtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);position:relative}
.ibtn:hover{border-color:var(--pri-t);color:var(--pri-t)}
.dot{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--pri);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 5px}
/* forms */
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld>label,.lbl{font-size:13px;font-weight:600;color:var(--mut)}
.in,select.in,textarea.in{width:100%;min-height:46px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font:inherit;font-size:15px}
textarea.in{min-height:96px;resize:vertical}
.in:hover{border-color:#9db3a9}
.in:focus{outline:2.5px solid var(--pri-t);outline-offset:1px;border-color:var(--pri-t)}
.in.bad{border-color:var(--err)}
.err{color:var(--err);font-size:12.5px;font-weight:500}
.hint{font-size:12.5px;color:var(--mut)}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;cursor:pointer;min-height:36px}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 14px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13.5px;font-weight:500}
button.chip:hover{border-color:var(--pri-t);color:var(--pri-t)}
.chip.on{background:var(--soft);border-color:var(--pri);color:var(--pri-t)}
.chip.rm{background:var(--soft);border-color:transparent;color:var(--pri-t)}
.badge{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:6px;font-size:12px;font-weight:600;background:var(--bg2);color:var(--mut);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.err{background:var(--err-bg);color:var(--err)}.badge.info{background:var(--info-bg);color:var(--info)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px}
.card.flat{box-shadow:none}
.card.sh{box-shadow:var(--shadow)}
/* announcement + header */
.ann{background:var(--ink);color:#E6F4EE;font-size:13.5px}
.ann .wrap{display:flex;align-items:center;justify-content:center;gap:14px;min-height:40px;position:relative;padding-right:56px}
.ann a{color:#8FE3C3;font-weight:600;text-decoration:underline;text-underline-offset:3px}
.ann button{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:0;color:#BFD9CE;width:34px;height:34px;border-radius:8px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr .wrap{display:flex;align-items:center;gap:18px;min-height:68px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px;letter-spacing:-.02em}
.logo b{color:var(--pri-t);font-weight:700}
.nav{display:flex;align-items:center;gap:2px;margin-left:8px;flex:1;min-width:0}
.nav a,.nav .navb{padding:8px 11px;border-radius:8px;font-size:14px;font-weight:500;color:var(--fg);background:none;border:0;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.nav a:hover,.nav .navb:hover{background:var(--soft)}
.nav a.on{color:var(--pri-t);font-weight:600}
.hr{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:none;height:40px;padding:0 11px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--soft);color:var(--pri-t)}
.menu{position:relative}
.pop{position:absolute;top:calc(100% + 8px);right:0;min-width:240px;background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:8px;z-index:60}
.pop.l{left:0;right:auto}
.pop a,.pop button.mi{display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:8px;font-size:14px;background:none;border:0;text-align:left}
.pop a:hover,.pop .mi:hover{background:var(--soft)}
.pop .sep{height:1px;background:var(--line);margin:6px 0}
.pop .cap{font-size:11.5px;color:var(--mut);padding:6px 12px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.burger{display:none}
.deskonly{display:flex}
/* hero */
.hero{background:linear-gradient(180deg,var(--soft),var(--bg) 100%);padding-top:44px}
.hero-g{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:48px;align-items:center}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--pri-t);background:var(--card);border:1px solid var(--line);padding:6px 12px;border-radius:8px}
.hero h1{font-size:clamp(2.1rem,4.6vw,3.6rem);line-height:1.22;margin:18px 0 16px;letter-spacing:-.02em}
.hero h1 em{font-style:normal;color:var(--pri-t)}
.hero p.lead{font-size:17px;color:var(--mut);max-width:560px;line-height:1.75}
.hero .chips{margin-top:22px;align-items:center}
.collage{position:relative;min-height:460px;display:grid;place-items:center}
.arch{width:min(78%,360px);aspect-ratio:4/5;border-radius:999px 999px 20px 20px;overflow:hidden;margin-left:auto;box-shadow:var(--shadow);background:var(--soft)}
.arch img,.circ img{width:100%;height:100%;object-fit:cover}
.circ{position:absolute;left:0;bottom:6%;width:min(44%,190px);aspect-ratio:1;border-radius:24px;overflow:hidden;border:5px solid var(--bg);box-shadow:var(--shadow)}
.float{position:absolute;right:0;bottom:-6px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px;max-width:210px}
.float strong{display:block;font-size:17px}
.sbox{position:relative;z-index:2;margin-top:36px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:18px;transform:translateY(34px)}
.sbox form{display:grid;grid-template-columns:1.2fr 1.2fr .9fr .9fr auto;gap:12px;align-items:end}
.hero-pad{height:34px}
/* sections */
.sec{padding-block:68px}
.sec.alt{background:var(--bg2)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:28px;flex-wrap:wrap}
.sec-h h2{font-size:clamp(1.5rem,2.6vw,2.1rem)}
.sec-h p{color:var(--mut);margin-top:6px;max-width:620px}
.link{color:var(--pri-t);font-weight:600;display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0}
.link:hover{text-decoration:underline;text-underline-offset:3px}
.cat{display:flex;flex-direction:column;gap:12px;padding:20px;border-radius:14px;border:1px solid var(--line);background:var(--card);text-align:left;transition:border-color .15s,transform .15s}
.cat:hover{border-color:var(--pri);transform:translateY(-2px)}
.cat .ci{width:46px;height:46px;border-radius:12px;background:var(--soft);color:var(--pri-t);display:grid;place-items:center}
.cat strong{font-size:15px;line-height:1.4}
.cat span{font-size:13px;color:var(--mut)}
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.loc{position:relative;border-radius:16px;overflow:hidden;aspect-ratio:16/10;display:block;width:100%;border:0;padding:0;text-align:left;background:var(--soft)}
.loc img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.loc:hover img{transform:scale(1.05)}
.loc:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(5,25,18,.78))}
.loc div{position:absolute;left:18px;right:18px;bottom:14px;z-index:1;color:#fff;display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.loc strong{font-size:19px;display:block;line-height:1.3}
.loc small{opacity:.88;font-size:13px}
.loc .go{width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.92);color:#0A5A42;display:grid;place-items:center}
/* property cards */
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
.pgrid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.pgrid.list{grid-template-columns:1fr}
.pc{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;transition:box-shadow .2s,border-color .2s;min-width:0}
.pc:hover{box-shadow:var(--shadow);border-color:#c5d4cc}
.pc-img{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden}
.pc-img img{width:100%;height:100%;object-fit:cover}
.pc-img .samp{position:absolute;left:12px;top:12px;background:rgba(255,255,255,.94);color:#0A5A42}
.fav{position:absolute;right:12px;top:12px;width:40px;height:40px;border-radius:10px;border:0;background:rgba(255,255,255,.94);color:#33403a;display:grid;place-items:center}
.fav.on{color:#D6336C}.fav.on svg{fill:#D6336C}
.pc-b{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1;min-width:0}
.pc-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tag{font-size:12.5px;font-weight:600;color:var(--pri-t)}
.cmpb{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--mut);cursor:pointer;min-height:30px}
.cmpb input{width:16px;height:16px;accent-color:var(--pri)}
.pc h3{font-size:16.5px;line-height:1.45}
.pc h3 a:hover{color:var(--pri-t)}
.loct{display:flex;align-items:center;gap:6px;font-size:13.5px;color:var(--mut)}
.price strong{font-size:21px;letter-spacing:-.01em}
.price span{color:var(--mut);font-size:13px}
.specs{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--mut);padding-top:10px;border-top:1px solid var(--line)}
.specs span{display:inline-flex;align-items:center;gap:6px}
.pc-f{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:auto;padding-top:4px;flex-wrap:wrap}
.avail{font-size:12.5px;color:var(--ok);font-weight:600;display:inline-flex;align-items:center;gap:6px}
.pc-list{flex-direction:row}
.pc-list .pc-img{width:300px;aspect-ratio:auto;min-height:220px;flex:none}
/* trust & steps */
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center}
.ticks{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.ticks div{display:flex;gap:12px;align-items:flex-start}
.ticks .ck{width:28px;height:28px;border-radius:8px;background:var(--soft);color:var(--pri-t);display:grid;place-items:center;flex:none;margin-top:2px}
.note{display:flex;gap:10px;background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:12px 14px;font-size:13.5px;font-weight:500;align-items:flex-start}
.note.info{background:var(--info-bg);color:var(--info)}
.step{display:flex;flex-direction:column;gap:12px;position:relative}
.step .sn{width:44px;height:44px;border-radius:12px;background:var(--pri);color:#fff;font-weight:700;display:grid;place-items:center;font-size:18px}
.feat{display:flex;flex-direction:column;gap:10px;padding:20px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.feat .ci{width:40px;height:40px;border-radius:10px;background:var(--soft);color:var(--pri-t);display:grid;place-items:center}
.feat h3{font-size:15.5px}
.feat p{font-size:14px;color:var(--mut)}
.lord{background:var(--ink);color:#E6F4EE;border-radius:24px;padding:48px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:40px;align-items:center}
.lord h2{font-size:clamp(1.5rem,2.8vw,2.2rem);color:#fff}
.lord .lg2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.lord .lg2 div{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.07);border-radius:12px;padding:14px;font-size:14px}
.lord .lg2 .ic{color:#8FE3C3;margin-top:2px}
.cta{background:var(--pri);color:#fff;border-radius:24px;padding:56px 32px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.cta h2{font-size:clamp(1.6rem,3vw,2.4rem);color:#fff}
.cta p{max-width:560px;opacity:.92}
details.faq{border-bottom:1px solid var(--line)}
details.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 4px;font-weight:600;font-size:16px;min-height:56px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary .ic{transition:transform .2s;color:var(--mut)}
details.faq[open] summary .ic{transform:rotate(180deg)}
details.faq .ans{padding:0 4px 20px;color:var(--mut);max-width:760px}
/* footer */
.foot{background:var(--ink);color:#BBD3C8;padding-top:56px;margin-top:0}
.foot .fg{display:grid;grid-template-columns:1.5fr repeat(4,minmax(0,1fr));gap:32px}
.foot h4{color:#fff;font-size:14px;margin-bottom:14px}
.foot a,.foot button.fl{display:block;padding:5px 0;font-size:14px;color:#BBD3C8;background:none;border:0;text-align:left}
.foot a:hover,.foot button.fl:hover{color:#fff}
.foot .logo{color:#fff}.foot .logo b{color:#6FE0B8}
.foot .bar{border-top:1px solid rgba(255,255,255,.12);margin-top:40px;padding-block:20px;display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;font-size:13px;align-items:center}
.foot select{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.2);border-radius:8px;height:38px;padding:0 10px;font:inherit}
.foot select option{color:#111}
.soc{display:flex;gap:8px;margin-top:16px}
.soc button{width:38px;height:38px;border-radius:9px;border:1px solid rgba(255,255,255,.2);background:none;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.soc button:hover{background:rgba(255,255,255,.1)}
/* listing page */
.page-h{padding-block:28px 8px}
.crumb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--mut);margin-bottom:12px}
.crumb a:hover,.crumb button:hover{color:var(--pri-t)}
.crumb button{background:none;border:0;padding:0;color:inherit;font-size:13px}
.lay{display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;align-items:start;padding-block:16px 64px}
.side{position:sticky;top:90px;display:flex;flex-direction:column;gap:18px}
.side .card{display:flex;flex-direction:column;gap:16px;padding:20px}
.tool{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.pag{display:flex;gap:6px;justify-content:center;margin-top:32px;flex-wrap:wrap}
.pag button{min-width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:600}
.pag button.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.pag button:disabled{opacity:.4;cursor:default}
.empty{text-align:center;padding:56px 20px;border:1px dashed var(--line);border-radius:16px;background:var(--bg2);display:flex;flex-direction:column;align-items:center;gap:12px}
.empty .ci{width:60px;height:60px;border-radius:16px;background:var(--soft);color:var(--pri-t);display:grid;place-items:center}
.empty p{color:var(--mut);max-width:420px}
.skel{border-radius:16px;border:1px solid var(--line);overflow:hidden;background:var(--card)}
.skel i{display:block;background:linear-gradient(90deg,var(--bg2),var(--soft),var(--bg2));background-size:200% 100%;animation:sh 1.2s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
/* details */
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:36px;align-items:start;padding-bottom:64px}
.gal{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px}
.gal .main{border-radius:18px;overflow:hidden;aspect-ratio:16/11;background:var(--soft);position:relative}
.gal .main img{width:100%;height:100%;object-fit:cover}

function results(){
  const f=S.f,q=(f.q||'').trim().toLowerCase();
  let r=pubProps().filter(p=>{
    if(f.loc&&p.loc!==f.loc)return false;if(f.type&&p.type!==f.type)return false;
    if(f.min&&p.rent<+f.min)return false;if(f.max&&p.rent>+f.max)return false;
    if(f.beds&&(f.beds==='4'?p.beds<4:p.beds!==+f.beds))return false;
    if(f.baths&&p.baths<+f.baths)return false;if(f.area&&p.sqft<+f.area)return false;
    if(f.furn&&p.furn!==f.furn)return false;
    if(f.avail==='now'&&p.avail!=='now')return false;
    if(f.avail==='soon'&&(p.avail==='now'||p.avail>'2026-11-10'))return false;
    if(q){const hay=[p.title[0],p.title[1],LOC[p.loc][0],LOC[p.loc][1],p.sub[0],p.sub[1],TYPE[p.type][0],TYPE[p.type][1]].join(' ').toLowerCase();if(!hay.includes(q))return false}
    return true});
  r.sort((a,b)=>f.sort==='low'?a.rent-b.rent:f.sort==='high'?b.rent-a.rent:a.days-b.days);return r}

  ${sel('furn','furn',Object.keys(FURN).map(k=>[k,pk(FURN[k])]),[t('ফার্নিশিং','Furnishing'),t('যেকোনো','Any')])}

function authShell(inner){return `<div class="auth"><div class="auth-l"><div>${logo()}</div><div><h2>${t('আপনার পছন্দের বাসা খুঁজুন সহজেই','Find the home you like, with ease')}</h2><p style="opacity:.8;margin-top:12px;max-width:380px">${t('সংরক্ষণ, তুলনা ও ভিজিট অনুরোধ এক অ্যাকাউন্টে।','Saved homes, comparison and visit requests in one account.')}</p></div><div class="note info" style="background:rgba(255,255,255,.1);color:#CFEFE2">${ic('info',18)}<span>${t('ডেমো মোড: কোনো আসল লগইন, ওটিপি বা ইমেইল পাঠানো হয় না।','Demo mode: no real login, OTP or email is sent.')}</span></div></div><div class="auth-r"><div class="auth-f">${inner}</div></div></div>`}
function demoNote(){return `<div class="note">${ic('info',18)}<span>${t('ডেমো মোড: তথ্য কোথাও পাঠানো বা সংরক্ষণ হয় না।','Demo mode: nothing is sent or stored anywhere.')}</span></div>`}
function roleSel(){return `<div class="role" role="radiogroup" aria-label="${t('আমি','I am a')}"><button type="button" role="radio" aria-checked="${S.auth.role==='tenant'}" class="${S.auth.role==='tenant'?'on':''}" data-a="role" data-v="tenant">${ic('user',20)}<strong>${t('ভাড়াটিয়া','Tenant')}</strong><small>${t('বাসা খুঁজছি','Looking for a home')}</small></button><button type="button" role="radio" aria-checked="${S.auth.role==='landlord'}" class="${S.auth.role==='landlord'?'on':''}" data-a="role" data-v="landlord">${ic('building',20)}<strong>${t('বাড়িওয়ালা','Landlord')}</strong><small>${t('বাসা ভাড়া দেব','Listing a property')}</small></button></div>`}
function fld(id,label,type,o={}){const e=S.errs[id];return `<div class="fld"><label for="a-${id}">${label}</label><input id="a-${id}" name="${id}" type="${type}" class="in${e?' bad':''}" ${o.ph?`placeholder="${o.ph}"`:''} ${o.ac?`autocomplete="${o.ac}"`:''} ${o.val?`value="${esc(o.val)}"`:''}>${e?`<span class="err" role="alert">${e}</span>`:''}</div>`}
function pLogin(){return authShell(`<h1>${t('লগইন','Log in')}</h1><p class="mut">${t('আপনার অ্যাকাউন্টে প্রবেশ করুন।','Sign in to your account.')}</p>${roleSel()}<form data-f="login" style="display:grid;gap:14px" novalidate>${fld('id',t('ইমেইল বা মোবাইল নম্বর','Email or mobile number'),'text',{ac:'username',ph:'01XXXXXXXXX'})}${fld('pw',t('পাসওয়ার্ড','Password'),'password',{ac:'current-password'})}<div style="display:flex;justify-content:space-between;align-items:center"><label class="chk"><input type="checkbox"> ${t('মনে রাখুন','Remember me')}</label><a href="#" class="link" data-a="go" data-v="forgot">${t('পাসওয়ার্ড ভুলে গেছেন?','Forgot password?')}</a></div><button class="btn pri lg block" type="submit">${t('লগইন','Log in')}</button></form>${demoNote()}<p class="mut" style="text-align:center">${t('অ্যাকাউন্ট নেই?','No account?')} <a href="#" class="link" data-a="go" data-v="register">${t('রেজিস্ট্রেশন করুন','Register')}</a></p>`)}
function pRegister(){return authShell(`<h1>${t('অ্যাকাউন্ট খুলুন','Create an account')}</h1><p class="mut">${t('কয়েক মিনিটেই শুরু করুন।','Get started in a minute.')}</p>${roleSel()}<form data-f="register" style="display:grid;gap:14px" novalidate>${fld('name',t('পূর্ণ নাম','Full name'),'text',{ac:'name'})}${fld('phone',t('মোবাইল নম্বর','Mobile number'),'tel',{ac:'tel',ph:'01XXXXXXXXX'})}${fld('mail',t('ইমেইল (ঐচ্ছিক)','Email (optional)'),'email',{ac:'email'})}${fld('pw',t('পাসওয়ার্ড (কমপক্ষে ৮ অক্ষর)','Password (min 8 characters)'),'password',{ac:'new-password'})}<label class="chk"><input type="checkbox" name="terms" id="a-terms"> <span>${t('আমি','I agree to the')} <a href="#" class="link" data-a="go" data-v="terms">${t('শর্তাবলি','Terms')}</a> ${t('ও','and')} <a href="#" class="link" data-a="go" data-v="privacy">${t('গোপনীয়তা নীতিতে','Privacy policy')}</a> ${t('সম্মত','')}</span></label>${S.errs.terms?`<span class="err" role="alert">${S.errs.terms}</span>`:''}<button class="btn pri lg block" type="submit">${t('রেজিস্ট্রেশন করুন','Register')}</button></form>${demoNote()}<p class="mut" style="text-align:center">${t('আগে থেকেই অ্যাকাউন্ট আছে?','Already have an account?')} <a href="#" class="link" data-a="go" data-v="login">${t('লগইন','Log in')}</a></p>`)}
function pForgot(){return authShell(`<h1>${t('পাসওয়ার্ড ভুলে গেছেন?','Forgot your password?')}</h1><p class="mut">${t('মোবাইল নম্বর বা ইমেইল দিন। বাস্তবে কোনো কোড পাঠানো হবে না।','Enter your mobile number or email. No code will actually be sent.')}</p><form data-f="forgot" style="display:grid;gap:14px" novalidate>${fld('id',t('মোবাইল নম্বর বা ইমেইল','Mobile number or email'),'text',{ph:'01XXXXXXXXX'})}<button class="btn pri lg block" type="submit">${t('কোড পাঠান (ডেমো)','Send code (demo)')}</button></form>${demoNote()}<a href="#" class="link" data-a="go" data-v="login">${ic('left',16)} ${t('লগইনে ফিরুন','Back to login')}</a>`)}
function pOtp(){return authShell(`<h1>${t('ওটিপি যাচাই','Verify OTP')}</h1><p class="mut">${t('ডেমো মোডে যেকোনো ৬ সংখ্যা দিলেই চলবে।','In demo mode any 6 digits will do.')}</p><form data-f="otp" style="display:grid;gap:14px" novalidate><div class="otp" role="group" aria-label="${t('৬ সংখ্যার কোড','6-digit code')}">${[0,1,2,3,4,5].map(i=>`<input inputmode="numeric" maxlength="1" data-otp="${i}" aria-label="${t('সংখ্যা','Digit')} ${nf(i+1)}" autocomplete="${i?'off':'one-time-code'}">`).join('')}</div>${S.errs.otp?`<span class="err" role="alert">${S.errs.otp}</span>`:''}<button class="btn pri lg block" type="submit">${t('যাচাই করুন','Verify')}</button></form>${demoNote()}<button type="button" class="link" data-a="resend">${t('আবার কোড পাঠান (ডেমো)','Resend code (demo)')}</button>`)}
function pReset(){const pw=S.pwv||'',sc=[pw.length>=8,/[A-Za-z]/.test(pw)&&/\d/.test(pw),/[^A-Za-z0-9]/.test(pw)||pw.length>=12].filter(Boolean).length;return authShell(`<h1>${t('নতুন পাসওয়ার্ড','Set a new password')}</h1><p class="mut">${t('ডেমো মোড: পাসওয়ার্ড কোথাও সংরক্ষণ হয় না।','Demo mode: the password is not stored anywhere.')}</p><form data-f="reset" style="display:grid;gap:14px" novalidate>${fld('pw',t('নতুন পাসওয়ার্ড','New password'),'password',{ac:'new-password'})}<div class="str" aria-hidden="true"><i class="${sc>0?'on':''}"></i><i class="${sc>1?'on':''}"></i><i class="${sc>2?'on':''}"></i></div>${fld('pw2',t('পাসওয়ার্ড নিশ্চিত করুন','Confirm password'),'password',{ac:'new-password'})}<button class="btn pri lg block" type="submit">${t('পাসওয়ার্ড বদলান','Update password')}</button></form>${demoNote()}`)}

/* ===== Information pages ===== */
function pPricing(){
  const pk3=[[t('বেসিক','Basic'),0,[t('১টি তালিকা','1 listing'),t('সাধারণ প্রদর্শন','Standard placement'),t('জিজ্ঞাসা গ্রহণ','Receive inquiries')],false],[t('স্ট্যান্ডার্ড','Standard'),500,[t('৫টি তালিকা','5 listings'),t('অগ্রাধিকার প্রদর্শন','Priority placement'),t('ভিজিট ব্যবস্থাপনা','Visit management'),t('বেসিক পরিসংখ্যান','Basic analytics')],true],[t('প্রো','Pro'),1500,[t('২০টি তালিকা','20 listings'),t('ফিচারড ব্যাজ','Featured badge'),t('বিস্তারিত পরিসংখ্যান','Detailed analytics'),t('একাধিক সম্পত্তি ব্যবস্থাপনা','Multi-property management')],false]];
  return `${pagehead(t('মূল্য ও ক্রেডিট','Pricing and credits'),t('নিচের মূল্য শুধু ডিজাইন প্রোটোটাইপের জন্য উদাহরণ। এটি কোনো বাস্তব বাণিজ্যিক প্রস্তাব নয়।','The prices below are illustrative for this design prototype only. They are not a real commercial offer.'))}
  <div class="wrap" style="padding-block:32px 64px"><div class="note" style="margin-bottom:24px">${ic('alert',18)}<span>${t('ডেমো মূল্য: কোনো পেমেন্ট প্রক্রিয়া করা হয় না।','Demo pricing: no payment is processed.')}</span></div><div class="grid3">${pk3.map(p=>`<div class="card price-c ${p[3]?'hot':''}"><div style="display:flex;justify-content:space-between;align-items:center"><h2>${p[0]}</h2>${p[3]?badge(t('জনপ্রিয়','Popular'),'ok'):''}</div><div class="big num">${tk(p[1])}<small style="font-size:14px;font-weight:500;color:var(--mut)"> /${t('মাস','mo')}</small></div><ul>${p[2].map(x=>`<li>${ic('check',16)}<span>${x}</span></li>`).join('')}</ul><button type="button" class="btn ${p[3]?'pri':'line'} block" data-a="planpick" data-v="${esc(p[0])}">${t('এটি বেছে নিন (ডেমো)','Choose (demo)')}</button></div>`).join('')}</div>
  <section class="dsec"><h2>${t('ক্রেডিট কীভাবে কাজ করে (উদাহরণ)','How credits work (example)')}</h2><div class="grid3">${[[t('তালিকা প্রকাশ','Publish a listing'),'১০ '+t('ক্রেডিট','credits'),'10 credits'],[t('ফিচারড করা','Feature a listing'),'৩০ '+t('ক্রেডিট','credits'),'30 credits'],[t('তালিকা নবায়ন','Renew a listing'),'৫ '+t('ক্রেডিট','credits'),'5 credits']].map(c=>`<div class="feat"><h3>${c[0]}</h3><p style="font-size:20px;font-weight:700;color:var(--fg)">${S.lang==='bn'?c[1]:c[2]}</p></div>`).join('')}</div></section></div>`}
function pHelp(){
  const topics=[['search',t('বাসা খোঁজা','Searching'),t('ফিল্টার ও সংরক্ষণ','Filters and saving')],['building',t('বাড়িওয়ালা','Landlords'),t('তালিকা তৈরি ও ব্যবস্থাপনা','Creating and managing listings')],['shield',t('নিরাপত্তা','Safety'),t('প্রতারণা এড়ানোর উপায়','Avoiding scams')],['user',t('অ্যাকাউন্ট','Account'),t('লগইন ও প্রোফাইল','Login and profile')]];
  return `${pagehead('Help Center',t('সাধারণ প্রশ্নের উত্তর এবং ব্যবহারের নির্দেশিকা।','Answers to common questions and how-to guides.'))}<div class="wrap" style="padding-block:32px 64px"><div class="grid4">${topics.map(x=>`<div class="feat"><div class="ci">${ic(x[0],22)}</div><h3>${x[1]}</h3><p>${x[2]}</p></div>`).join('')}</div><div style="max-width:860px;margin-top:40px"><h2 style="margin-bottom:12px">${t('জনপ্রিয় প্রশ্ন','Popular questions')}</h2>${faqList(FAQS())}</div><div class="card flat" style="margin-top:32px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap"><div><h3>${t('উত্তর পাননি?','Did not find an answer?')}</h3><p class="mut">${t('যোগাযোগ ফর্মে প্রশ্ন লিখুন (ডেমো)।','Write to us using the contact form (demo).')}</p></div><button type="button" class="btn pri" data-a="go" data-v="contact">${t('যোগাযোগ করুন','Contact us')}</button></div></div>`}
function pFaq(){return `${pagehead(t('সচরাচর জিজ্ঞাসা','Frequently asked questions'))}<div class="wrap" style="padding-block:24px 64px;max-width:860px">${faqList(FAQS())}</div>`}
function pAbout(){return `${pagehead(t('ToLet.com সম্পর্কে','About ToLet.com'),t('ঢাকায় বাসা খোঁজা ও ভাড়া দেওয়ার প্রক্রিয়া সহজ ও স্বচ্ছ করার একটি ডিজাইন প্রোটোটাইপ।','A design prototype for making house-hunting and renting in Dhaka simpler and more transparent.'))}<div class="wrap" style="padding-block:32px 64px"><div class="legal"><p style="font-size:17px;color:var(--fg)">${t('ToLet.com বাংলাদেশের ভাড়াটিয়া ও বাড়িওয়ালাদের এক জায়গায় আনার ধারণা। এই সংস্করণ একটি ইন্টারঅ্যাকটিভ প্রোটোটাইপ, তাই সব তালিকা, ব্যবহারকারী ও পরিসংখ্যান কাল্পনিক নমুনা।','ToLet.com is an idea for bringing tenants and landlords in Bangladesh together in one place. This version is an interactive prototype, so every listing, user and statistic is a fictional sample.')}</p><h2>${t('আমরা কী গড়তে চাই','What we want to build')}</h2><ul><li>${t('বাজেট ও এলাকা অনুযায়ী দ্রুত খোঁজ','Fast search by budget and area')}</li><li>${t('তুলনা ও ভিজিট অনুরোধ','Comparison and visit requests')}</li><li>${t('বাড়িওয়ালাদের জন্য সহজ ব্যবস্থাপনা','Simple management for landlords')}</li><li>${t('প্রতারণা কমানোর নিরাপত্তা নির্দেশিকা','Safety guidance that reduces scams')}</li></ul><h2>${t('প্রোটোটাইপের সীমাবদ্ধতা','Prototype limitations')}</h2><p>${t('কোনো ব্যাকএন্ড, পেমেন্ট, লগইন বা বার্তা পাঠানোর সিস্টেম যুক্ত নেই। ছবিগুলো তৈরি করা চিত্র।','No backend, payments, authentication or messaging is connected. Images are generated illustrations.')}</p></div></div>`}
function pContact(){const e=S.errs,er=k=>e[k]?`<span class="err" role="alert">${e[k]}</span>`:'';return `${pagehead(t('যোগাযোগ','Contact us'),t('ডেমো ফর্ম: বার্তা কোনো সাপোর্ট টিমের কাছে যায় না।','Demo form: messages are not sent to any support team.'))}<div class="wrap" style="padding-block:32px 64px"><div class="split" style="align-items:start"><form data-f="contact" class="card" style="display:grid;gap:14px" novalidate><div class="fld"><label for="c-n">${t('নাম','Name')}</label><input id="c-n" name="name" class="in${e.name?' bad':''}">${er('name')}</div><div class="fld"><label for="c-m">${t('ইমেইল','Email')}</label><input id="c-m" name="mail" type="email" class="in${e.mail?' bad':''}">${er('mail')}</div><div class="fld"><label for="c-s">${t('বিষয়','Topic')}</label><select id="c-s" name="topic" class="in"><option>${t('সাধারণ প্রশ্ন','General question')}</option><option>${t('তালিকা সংক্রান্ত','About a listing')}</option><option>${t('রিপোর্ট করুন','Report a problem')}</option></select></div><div class="fld"><label for="c-b">${t('বার্তা','Message')}</label><textarea id="c-b" name="msg" class="in${e.msg?' bad':''}"></textarea>${er('msg')}</div><button class="btn pri lg" type="submit">${t('বার্তা পাঠান (ডেমো)','Send message (demo)')}</button></form><div style="display:grid;gap:14px">${[['mail','hello@tolet.example',t('ইমেইল (কাল্পনিক ঠিকানা)','Email (fictional address)')],['phone','০১৭XX-XXXXXX',t('ফোন (কাল্পনিক নম্বর)','Phone (fictional number)')],['pin',t('ঢাকা, বাংলাদেশ','Dhaka, Bangladesh'),t('অফিস (নমুনা)','Office (sample)')]].map(c=>`<div class="feat" style="flex-direction:row;align-items:center"><div class="ci">${ic(c[0],22)}</div><div><strong>${c[1]}</strong><div class="mut" style="font-size:13px">${c[2]}</div></div></div>`).join('')}</div></div></div>`}
function pSafety(){const tips=[[t('বাসা নিজে দেখুন','View the home in person'),t('অগ্রিম বা বুকিং ফি দেওয়ার আগে নিজে গিয়ে ভেতরে-বাইরে দেখুন। সম্ভব হলে সাথে বিশ্বস্ত কাউকে নিন।','Go and see the inside and outside before paying any advance or booking fee. Bring someone you trust if you can.')],[t('ভাড়ার শর্ত লিখিত নিন','Get the terms in writing'),t('মাসিক ভাড়া, অগ্রিম, সার্ভিস চার্জ, বিল, মেয়াদ ও নোটিস সময় চুক্তিপত্রে স্পষ্ট থাকা উচিত।','Monthly rent, advance, service charge, bills, duration and notice period should be clear in the agreement.')],[t('পরিচয় যথাযথভাবে যাচাই করুন','Check identity appropriately'),t('বাড়িওয়ালার পরিচয় ও বাসার মালিকানার কাগজ সৌজন্যের সাথে দেখতে চান। নিজের এনআইডি কপি দিলে কাজের উদ্দেশ্য লিখে দিন।','Politely ask for the landlord’s identity and proof of ownership. If you share your NID copy, note its purpose on it.')],[t('সন্দেহজনক অগ্রিম এড়ান','Avoid suspicious advance payments'),t('দেখার আগে টাকা চাওয়া, অতিরিক্ত তাড়া দেওয়া বা বাজারদরের চেয়ে অনেক কম ভাড়া দেখালে সতর্ক হোন। মোবাইল ব্যাংকিংয়ে অচেনা কাউকে টাকা পাঠাবেন না।','Be wary of requests for money before viewing, heavy pressure to hurry, or rent far below the market rate. Do not send money by mobile banking to someone you do not know.')],[t('রসিদ ও প্রমাণ রাখুন','Keep receipts and records'),t('প্রতিটি লেনদেনের রসিদ রাখুন এবং বার্তা ও চুক্তির কপি সংরক্ষণ করুন।','Keep a receipt for every payment and save copies of messages and the agreement.')]];
  return `${pagehead(t('ভাড়ার নিরাপত্তা','Rental safety'),t('বাসা ভাড়ার সময় সাধারণ ঝুঁকি এড়াতে কয়েকটি ব্যবহারিক পরামর্শ।','Practical advice for avoiding common risks when renting.'))}<div class="wrap" style="padding-block:32px 64px"><div class="grid2">${tips.map((x,i)=>`<div class="feat"><div class="ci">${ic(['eye','file','key','alert','check'][i],22)}</div><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="note info" style="margin-top:20px">${ic('info',18)}<span>${t('এটি সাধারণ নির্দেশিকা, আইনি পরামর্শ নয়।','This is general guidance, not legal advice.')}</span></div></div>`}
function pLegal(k){const P=k==='privacy';const items=P?[[t('আমরা কী সংগ্রহ করি','What we collect'),t('এই প্রোটোটাইপ কোনো ব্যক্তিগত তথ্য সার্ভারে পাঠায় না। পছন্দের তালিকা ও ভাষা শুধু আপনার ব্রাউজারে সংরক্ষিত হয়।','This prototype does not send personal data to any server. Your saved homes and language are stored only in your browser.')],[t('ভবিষ্যৎ সংস্করণ','A future live version'),t('বাস্তব সংস্করণ চালুর আগে একটি পূর্ণাঙ্গ গোপনীয়তা নীতি প্রকাশ করা হবে।','A complete privacy policy would be published before any live version launches.')],[t('আপনার নিয়ন্ত্রণ','Your control'),t('ব্রাউজারের সাইট ডেটা মুছলেই সংরক্ষিত তথ্য মুছে যায়।','Clearing your browser’s site data removes everything saved.')]]:[[t('প্রোটোটাইপের ব্যবহার','Using the prototype'),t('এটি ডিজাইন মূল্যায়নের জন্য তৈরি। তালিকা, ব্যবহারকারী ও লেনদেন কাল্পনিক।','This is for design evaluation. Listings, users and transactions are fictional.')],[t('কোনো প্রস্তাব নয়','No offers'),t('মূল্য বা শর্ত কোনো বাস্তব চুক্তি বা বাণিজ্যিক প্রস্তাব নয়।','Prices and terms are not a real contract or commercial offer.')],[t('ভবিষ্যৎ সংস্করণ','A future live version'),t('বাস্তব শর্তাবলি আইনি পরামর্শ নিয়ে তৈরি করতে হবে।','Real terms would need to be drafted with legal advice.')]];
  return `${pagehead(P?t('গোপনীয়তা নীতি','Privacy policy'):t('শর্তাবলি','Terms and conditions'),t('প্রোটোটাইপের জন্য সংক্ষিপ্ত খসড়া।','A short draft for the prototype.'))}<div class="wrap" style="padding-block:32px"><div class="legal">${items.map(i=>`<h2>${i[0]}</h2><p>${i[1]}</p>`).join('')}</div></div>`}

  if(S.submitted){const p=S.submitted;return `<div class="card sh" style="max-width:640px;display:grid;gap:14px;justify-items:start"><div class="empty" style="width:100%;border:0;background:none"><div class="ci">${ic('check',30)}</div><h2>${t('তালিকা জমা হয়েছে (ডেমো)','Listing submitted (demo)')}</h2><p>${t('এটি রিভিউয়ের অপেক্ষায় থাকবে। অ্যাডমিন ড্যাশবোর্ড থেকে এটি অনুমোদন করলে পাবলিক তালিকায় দেখা যাবে।','It now waits for review. Once approved from the admin dashboard it appears in the public listings.')}</p><div style="display:flex;gap:10px;align-items:center">${stBadge('pending')}<strong>${esc(pk(p.title))}</strong></div></div><div class="chips"><button type="button" class="btn pri" data-a="dash" data-role="landlord" data-page="properties">${t('আমার বাসা','My properties')}</button><button type="button" class="btn line" data-a="padd">${t('আরেকটি যোগ করুন','Add another')}</button><button type="button" class="btn line" data-a="dash" data-role="admin" data-page="pending">${t('অ্যাডমিন ভিউ খুলুন','Open admin view')}</button></div></div>`}
  if(!S.draft)S.draft=newDraft();
  const d=S.draft,st=S.step,e=S.errs,er=k=>e[k]?`<span class="err" role="alert">${e[k]}</span>`:'',bd=k=>e[k]?' bad':'';
  const so=(o,v)=>Object.keys(o).map(k=>`<option value="${k}" ${v===k?'selected':''}>${pk(o[k])}</option>`).join('');
  const cg=(key,dict)=>Object.keys(dict).map(k=>`<label class="chk"><input type="checkbox" data-dg="${key}" value="${k}" ${d[key].includes(k)?'checked':''}> ${pk(dict[k])}</label>`).join('');
  let body='';
  if(st===1)body=`<div class="fld"><label for="d-title">${t('শিরোনাম','Title')}</label><input id="d-title" class="in${bd('title')}" data-d="title" value="${esc(d.title)}" maxlength="90" placeholder="${t('যেমন: বনশ্রীতে ৩ বেডরুমের ফ্ল্যাট','e.g. 3-bedroom flat in Banasree')}">${er('title')}</div><div class="grid2"><div class="fld"><label for="d-type">${t('বাসার ধরন','Property type')}</label><select id="d-type" class="in" data-d="type">${so(TYPE,d.type)}</select></div><div class="fld"><label for="d-furn">${t('ফার্নিশিং','Furnishing')}</label><select id="d-furn" class="in" data-d="furn">${so(FURN,d.furn)}</select></div></div><div class="fld"><label for="d-desc">${t('বিবরণ','Description')}</label><textarea id="d-desc" class="in${bd('desc')}" data-d="desc" placeholder="${t('বাসার বিশেষত্ব, আশপাশ ও যাতায়াত সম্পর্কে লিখুন','Describe the home, neighbourhood and transport')}">${esc(d.desc)}</textarea>${er('desc')}</div>`;
  if(st===2)body=`<div class="grid2"><div class="fld"><label for="d-loc">${t('এলাকা','Area')}</label><select id="d-loc" class="in${bd('loc')}" data-d="loc"><option value="">${t('বেছে নিন','Select')}</option>${so(LOC,d.loc)}</select>${er('loc')}</div><div class="fld"><label for="d-floor">${t('তলা','Floor')}</label><input id="d-floor" class="in" type="number" min="0" max="40" data-d="floor" value="${esc(d.floor)}"></div></div><div class="fld"><label for="d-addr">${t('ঠিকানা (ব্লক/রোড/বাড়ি)','Address (block, road, house)')}</label><input id="d-addr" class="in${bd('addr')}" data-d="addr" value="${esc(d.addr)}">${er('addr')}<span class="hint">${t('সঠিক বাড়ির নম্বর জনসমক্ষে না দেওয়াই ভালো।','Avoid publishing the exact house number.')}</span></div><div class="fld"><label for="d-land">${t('কাছের পরিচিত স্থান','Nearby landmark')}</label><input id="d-land" class="in" data-d="landmark" value="${esc(d.landmark)}"></div>`;
  if(st===3)body=`<div class="grid3"><div class="fld"><label for="d-rent">${t('মাসিক ভাড়া (৳)','Monthly rent (৳)')}</label><input id="d-rent" class="in${bd('rent')}" type="number" min="0" step="500" inputmode="numeric" data-d="rent" value="${esc(d.rent)}">${er('rent')}</div><div class="fld"><label for="d-adv">${t('অগ্রিম (মাস)','Advance (months)')}</label><input id="d-adv" class="in${bd('adv')}" type="number" min="0" max="6" data-d="adv" value="${esc(d.adv)}">${er('adv')}</div><div class="fld"><label for="d-avail">${t('খালি হবে','Available from')}</label><input id="d-avail" class="in${bd('avail')}" type="date" data-d="avail" value="${esc(d.avail)}" min="2026-10-10">${er('avail')}</div></div><fieldset style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">${t('ভাড়ার শর্ত','Rental conditions')}</legend><div class="grid2" style="gap:0 16px">${cg('cond',CO)}</div></fieldset>`;
  if(st===4)body=`<div class="grid3"><div class="fld"><label for="d-beds">${t('বেডরুম','Bedrooms')}</label><input id="d-beds" class="in${bd('beds')}" type="number" min="0" max="10" data-d="beds" value="${esc(d.beds)}">${er('beds')}</div><div class="fld"><label for="d-baths">${t('বাথরুম','Bathrooms')}</label><input id="d-baths" class="in${bd('baths')}" type="number" min="1" max="10" data-d="baths" value="${esc(d.baths)}">${er('baths')}</div><div class="fld"><label for="d-sqft">${t('আয়তন (বর্গফুট)','Area (sq ft)')}</label><input id="d-sqft" class="in${bd('sqft')}" type="number" min="0" step="10" data-d="sqft" value="${esc(d.sqft)}">${er('sqft')}</div></div><fieldset style="border:0;padding:0;margin:0"><legend class="lbl" style="margin-bottom:8px">${t('সুবিধাসমূহ','Amenities')}</legend><div class="grid3" style="gap:0 16px">${cg('amen',AM)}</div></fieldset>`;
  if(st===5)body=`<div class="up"><div class="ci" style="width:52px;height:52px;border-radius:14px;background:var(--soft);color:var(--pri-t);display:grid;place-items:center">${ic('upload',24)}</div><strong>${t('ছবি বেছে নিন','Choose photos')}</strong><span class="hint">${t('সর্বোচ্চ ৮টি। ছবি কোথাও আপলোড হয় না, শুধু এই পৃষ্ঠায় প্রিভিউ দেখা যায়।','Up to 8. Photos are not uploaded anywhere; they only preview on this page.')}</span><div class="chips" style="justify-content:center"><label class="btn pri" for="d-files" style="cursor:pointer">${ic('image',18)} ${t('ছবি নির্বাচন','Select photos')}</label><button type="button" class="btn line" data-a="sampleimg">${t('নমুনা চিত্র যোগ করুন','Add a sample illustration')}</button></div><input id="d-files" class="sr" type="file" accept="image/*" multiple data-files="1"></div>${er('imgs')}${d.imgs.length?`<div class="thumbs">${d.imgs.map((m,i)=>`<div><img src="${m.url}" alt="${esc(m.name)}"><button type="button" data-a="imgrm" data-v="${i}" aria-label="${t('ছবি সরান','Remove photo')} ${nf(i+1)}">${ic('x',16)}</button></div>`).join('')}</div>`:''}`;
  if(st===6){const rows=[[t('শিরোনাম','Title'),esc(d.title)],[t('ধরন','Type'),typeName(d.type)],[t('এলাকা','Area'),d.loc?locName(d.loc)+', '+esc(d.addr):'—'],[t('ভাড়া','Rent'),d.rent?tk(d.rent):'—'],[t('অগ্রিম','Advance'),nf(d.adv)+' '+t('মাস','months')],[t('রুম','Rooms'),`${nf(d.beds)} ${t('বেড','bed')}, ${nf(d.baths)} ${t('বাথ','bath')}, ${nf(d.sqft||0)} ${t('বর্গফুট','sq ft')}`],[t('সুবিধা','Amenities'),d.amen.map(a=>pk(AM[a])).join(', ')||'—'],[t('ছবি','Photos'),nf(d.imgs.length)]];
    body=`<div class="card flat">${rows.map(r=>`<div class="row"><span class="mut">${r[0]}</span><strong style="text-align:right">${r[1]}</strong></div>`).join('')}</div><label class="chk"><input type="checkbox" data-dagree="1" ${d.agree?'checked':''}> ${t('আমি নিশ্চিত করছি যে তথ্য সঠিক এবং এটি জমা দিলে রিভিউ হবে (ডেমো)।','I confirm the information is accurate and understand it will be reviewed (demo).')}</label>${er('agree')}<div class="note info">${ic('info',18)}<span>${t('জমা দিলে মডারেশন অবস্থা “অপেক্ষমাণ” হবে। কোনো বাস্তব সার্ভারে কিছু যায় না।','After submitting, moderation status becomes “Pending”. Nothing goes to a real server.')}</span></div>`}
  return `<div style="display:grid;gap:18px;max-width:860px"><div class="steps" aria-label="${t('ধাপ','Steps')}">${STEPS.map((s,i)=>`<div class="${i+1===st?'on':i+1<st?'done':''}" ${i+1===st?'aria-current="step"':''}><b>${i+1<st?ic('check',12):nf(i+1)}</b><span>${pk(s)}</span></div>`).join('')}</div>
  <div class="card" style="display:grid;gap:18px"><h2>${S.editId?t('বাসা সম্পাদনা','Edit property')+' · ':''}${nf(st)}. ${pk(STEPS[st-1])}</h2>${body}<div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:16px"><div class="chips"><button type="button" class="btn line" data-a="sprev" ${st===1?'disabled style="opacity:.5"':''}>${ic('left',16)} ${t('আগের','Back')}</button><button type="button" class="btn ghost" data-a="savedraft">${t('খসড়া সংরক্ষণ','Save draft')}</button></div>${st<6?`<button type="button" class="btn pri" data-a="snext">${t('পরের ধাপ','Next')} ${ic('right',16)}</button>`:`<button type="button" class="btn pri" data-a="ssubmit">${t('জমা দিন','Submit listing')}</button>`}</div></div></div>`}

/* admin */
const AP={
overview(){const pend=S.props.filter(p=>p.status==='pending');return `<div class="sum">${sc('clock',t('অপেক্ষমাণ তালিকা','Pending listings'),nf(pend.length),t('অনুমোদন প্রয়োজন','Needs review'))}${sc('users',t('ব্যবহারকারী (নমুনা)','Users (sample)'),nf(S.users.length),t('ডেমো তালিকা','Demo list'))}${sc('flag',t('খোলা রিপোর্ট','Open reports'),nf(S.reports.filter(r=>r.st!=='resolved').length),t('মনোযোগ দরকার','Needs attention'))}${sc('life',t('খোলা সাপোর্ট','Open tickets'),nf(S.tickets.filter(x=>x.st==='open').length),t('উত্তর বাকি','Awaiting reply'))}</div>
  <div class="two"><div class="card"><div class="ch"><h2>${t('অনুমোদনের সারি','Approval queue')}</h2><button type="button" class="link" data-a="dash" data-role="admin" data-page="pending">${t('সব','All')} ${ic('right',14)}</button></div>${pend.length?pend.slice(0,4).map(p=>miniProp(p,`<div class="acts">${btn('pmod','',{id:p.id,v:'approve',c:'pri',i:'check',sr:t('অনুমোদন','Approve')})}</div>`)).join(''):`<p class="mut">${t('কোনো অপেক্ষমাণ তালিকা নেই।','No pending listings.')}</p>`}</div><div class="card"><div class="ch"><h2>${t('দৈনিক ভিউ (নমুনা)','Daily views (sample)')}</h2></div>${lineChart(VIEWS.map(v=>v*8),dayLabels(14))}</div></div>`},
analytics(){const loc=Object.keys(LOC).map(k=>[locName(k).slice(0,7),S.props.filter(p=>p.loc===k).length]),ty=Object.keys(TYPE).map(k=>[typeName(k).split(' ')[0].slice(0,8),S.props.filter(p=>p.type===k).length]);return `<div class="two" style="grid-template-columns:1fr 1fr"><div class="card"><div class="ch"><h2>${t('এলাকা অনুযায়ী তালিকা','Listings by area')}</h2></div>${barChart(loc)}</div><div class="card"><div class="ch"><h2>${t('ধরন অনুযায়ী তালিকা','Listings by type')}</h2></div>${barChart(ty)}</div></div><div class="card"><div class="ch"><h2>${t('ট্রাফিক (নমুনা)','Traffic (sample)')}</h2></div>${lineChart(VIEWS.map(v=>v*12),dayLabels(14),220)}</div>`},
moderation(){const f=S.dash.pf,q=S.dash.q.toLowerCase(),l=S.props.filter(p=>(f==='all'||p.status===f)&&(!q||(p.title[0]+p.title[1]+p.id).toLowerCase().includes(q)));
  return `<div class="fbar"><div class="fld" style="flex:1;max-width:320px"><label class="sr" for="mq">${t('খুঁজুন','Search')}</label><input id="mq" class="in" type="search" data-dq="1" value="${esc(S.dash.q)}" placeholder="${t('শিরোনাম বা আইডি, এন্টার চাপুন','Title or ID, press Enter')}" style="max-width:none"></div></div>${tabbar([['all',t('সব','All')],['pending',t('অপেক্ষমাণ','Pending')],['active',t('প্রকাশিত','Published')],['rejected',t('প্রত্যাখ্যাত','Rejected')],['suspended',t('স্থগিত','Suspended')],['draft',t('খসড়া','Draft')]],f,'pf')}${l.length?table([t('আইডি','ID'),t('বাসা','Property'),t('বাড়িওয়ালা','Landlord'),t('ভাড়া','Rent'),t('অবস্থা','Status'),t('কার্যক্রম','Actions')],l.map(p=>[p.id.toUpperCase(),`<span style="display:block;min-width:200px">${esc(pk(p.title))}</span>`,esc(pk(LL[p.ll%LL.length])),tk(p.rent),stBadge(p.status),modActs(p)])):empty('search',t('কোনো রেকর্ড নেই','No records'),t('ফিল্টার বদলান।','Try another filter.'))}`},
pending(){const l=S.props.filter(p=>p.status==='pending');return l.length?table([t('আইডি','ID'),t('বাসা','Property'),t('বাড়িওয়ালা','Landlord'),t('ভাড়া','Rent'),t('কার্যক্রম','Actions')],l.map(p=>[p.id.toUpperCase(),`<span style="display:block;min-width:200px">${esc(pk(p.title))}</span>`,esc(pk(LL[p.ll%LL.length])),tk(p.rent),modActs(p)])):empty('check',t('সব অনুমোদন সম্পন্ন','All caught up'),t('অপেক্ষমাণ কোনো তালিকা নেই।','There are no pending listings.'))},
users(){const f=S.dash.role,q=S.dash.q.toLowerCase(),l=S.users.filter(u=>(f==='all'||u.role===f)&&(!q||(u.n[0]+u.n[1]).toLowerCase().includes(q)));return `<div class="fbar"><div class="fld" style="flex:1;max-width:320px"><label class="sr" for="uq">${t('খুঁজুন','Search')}</label><input id="uq" class="in" type="search" data-dq="1" value="${esc(S.dash.q)}" placeholder="${t('নাম লিখে এন্টার চাপুন','Name, then Enter')}" style="max-width:none"></div><div class="fld"><label class="sr" for="ur">${t('ভূমিকা','Role')}</label><select id="ur" class="in" data-drole="1" style="width:auto"><option value="all">${t('সব ভূমিকা','All roles')}</option><option value="tenant" ${f==='tenant'?'selected':''}>${t('ভাড়াটিয়া','Tenant')}</option><option value="landlord" ${f==='landlord'?'selected':''}>${t('বাড়িওয়ালা','Landlord')}</option></select></div></div>${l.length?table([t('নাম','Name'),t('ভূমিকা','Role'),t('ইমেইল (মাস্কড)','Email (masked)'),t('যোগদান','Joined'),t('অবস্থা','Status'),''],l.map(u=>[esc(pk(u.n)),u.role==='landlord'?t('বাড়িওয়ালা','Landlord'):t('ভাড়াটিয়া','Tenant'),u.mail,fd(u.joined),sb(u.st),`<div class="acts">${btn('uview',t('বিস্তারিত','Details'),{id:u.id})}${btn('utoggle',u.st==='active'?t('স্থগিত','Suspend'):t('সক্রিয়','Activate'),{id:u.id,c:u.st==='active'?'danger':'line'})}</div>`])):empty('users',t('কোনো ব্যবহারকারী পাওয়া যায়নি','No users found'),'')}`},
wanted(){return table([t('অনুরোধকারী','Requester'),t('এলাকা','Area'),t('বাজেট','Budget'),t('অবস্থা','Status'),''],S.wanted.map(w=>[esc(nm(w.by)),locName(w.loc),`${tk(w.min)}–${tk(w.max)}`,sb(w.status),`<div class="acts">${w.status!=='active'?btn('wmod',t('অনুমোদন','Approve'),{id:w.id,v:'active',c:'pri'}):''}${w.status!=='removed'?btn('wmod',t('সরান','Remove'),{id:w.id,v:'removed'}):''}</div>`]))},
reviews(){return `<div class="note">${ic('alert',18)}<span>${t('এগুলো পরীক্ষামূলক নমুনা মন্তব্য, বাস্তব রিভিউ নয়।','These are test sample comments, not real reviews.')}</span></div>${table([t('মন্তব্য','Comment'),t('বাসা','Property'),t('অবস্থা','Status'),''],S.reviews.map(r=>[`<span style="display:block;min-width:240px">${esc(pk(r.t))}</span>`,plink(r.prop),sb(r.st),`<div class="acts">${r.st!=='approved'?btn('rvmod',t('অনুমোদন','Approve'),{id:r.id,v:'approved',c:'pri'}):''}${r.st!=='removed'?btn('rvmod',t('সরান','Remove'),{id:r.id,v:'removed'}):''}</div>`]))}`},
reports(){return table([t('ধরন','Type'),t('বাসা','Target'),t('রিপোর্টকারী','Reported by'),t('তারিখ','Date'),t('অবস্থা','Status'),''],S.reports.map(r=>[pk(r.type),plink(r.target),esc(pk(r.by)),fd(r.date),sb(r.st),`<div class="acts">${r.st==='open'?btn('rpt',t('রিভিউ শুরু','Start review'),{id:r.id,v:'review'}):''}${r.st!=='resolved'?btn('rpt',t('সমাধান','Resolve'),{id:r.id,v:'resolved',c:'pri'}):btn('rpt',t('আবার খুলুন','Reopen'),{id:r.id,v:'open'})}</div>`]))},

function render(){
  const y=window.scrollY,r=S.route,aid=document.activeElement&&document.activeElement.id;let html;
  if(r.name==='dash')html=dashboard()+(S.drawer==='side'?sideDrawer():'');
  else{const auth=['login','register','forgot','otp','reset'].includes(r.name);html=header()+`<main id="main">${view()}</main>`+(auth?'':footer())+cmpBar()+(S.drawer==='nav'?navDrawer():'')+(S.drawer==='filters'?filterDrawer():'')}
  html+=modalHtml();
  app.innerHTML=html;document.documentElement.lang=S.lang==='bn'?'bn':'en';
  if(S.keep){const f=app.querySelector(`form[data-f="${S.keep.form}"]`);if(f){[...f.elements].forEach(el=>{if(!el.name)return;if(el.type==='checkbox')el.checked=el.name in S.keep.vals;else if(el.type!=='file'&&el.name in S.keep.vals)el.value=S.keep.vals[el.name]})}S.keep=null}
  window.scrollTo(0,topNext?0:y);topNext=false;
  const bad=app.querySelector('.in.bad');
  if(S.modal){const m=bad&&bad.closest('#modal')?bad:document.getElementById('modal');m&&m.focus({preventScroll:true})}
  else if(bad&&Object.keys(S.errs).length){bad.focus({preventScroll:true})}
  else if(aid){const el=document.getElementById(aid);if(el&&el!==document.activeElement){try{el.focus({preventScroll:true});if(el.setSelectionRange&&/text|search/.test(el.type||''))el.setSelectionRange(el.value.length,el.value.length)}catch(e){}}}
}

function buildProp(status,id){const d=S.draft,seed=Math.floor(Math.random()*900)+300;const addr=d.addr||d.landmark||'—';

function checkStep(){const d=S.draft,e={},s=S.step;
  if(s===1){if((d.title||'').trim().length<8)e.title=t('কমপক্ষে ৮ অক্ষরের শিরোনাম দিন','Enter a title of at least 8 characters');if((d.desc||'').trim().length<20)e.desc=t('কমপক্ষে ২০ অক্ষরের বিবরণ দিন','Enter a description of at least 20 characters')}
  if(s===2){if(!d.loc)e.loc=t('এলাকা বেছে নিন','Select an area');if(!(d.addr||'').trim())e.addr=t('ঠিকানা লিখুন','Enter the address')}
  if(s===3){if(!(+d.rent>0))e.rent=t('সঠিক ভাড়া লিখুন','Enter a valid rent');if(d.adv===''||+d.adv<0||+d.adv>6)e.adv=t('অগ্রিম ০–৬ মাসের মধ্যে হতে হবে','Advance must be 0–6 months');if(!d.avail)e.avail=t('তারিখ বেছে নিন','Pick a date')}
  if(s===4){if(d.beds===''||+d.beds<0||+d.beds>10)e.beds=t('০–১০ এর মধ্যে','Between 0 and 10');if(!(+d.baths>=1))e.baths=t('কমপক্ষে ১','At least 1');if(!(+d.sqft>=50))e.sqft=t('কমপক্ষে ৫০ বর্গফুট','At least 50 sq ft')}
  if(s===5){if(!d.imgs.length)e.imgs=t('কমপক্ষে একটি ছবি যোগ করুন','Add at least one photo')}
  if(s===6){if(!d.agree)e.agree=t('নিশ্চিত করতে টিক দিন','Please tick to confirm')}
  S.errs=e;return !Object.keys(e).length}

document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');
  if(!el){if(S.menu&&!e.target.closest('.menu')){S.menu=null;render()}return}
  const fn=ACT[el.dataset.a];if(!fn)return;
  if(el.tagName==='A')e.preventDefault();
  if(S.menu&&!el.closest('.menu')&&el.dataset.a!=='menu')S.menu=null;
  fn(el.dataset,el,e)});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-f]');if(!f)return;e.preventDefault();const fn=FORMS[f.dataset.f];if(fn)fn(f)});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset.fk){const k=el.dataset.fk;S.f[k]=el.value;if(k==='sort'){S.f.page=1;render()}else applyFilter()}
  else if(el.dataset.wk){S.wf[el.dataset.wk]=el.value;render()}
  else if(el.dataset.d){S.draft[el.dataset.d]=el.value}
  else if(el.dataset.dg){const a=S.draft[el.dataset.dg],i=a.indexOf(el.value);if(el.checked&&i<0)a.push(el.value);if(!el.checked&&i>=0)a.splice(i,1)}
  else if(el.dataset.dagree){S.draft.agree=el.checked;S.errs={};}
  else if(el.dataset.files){const files=[...el.files];files.forEach(f=>{if(S.draft.imgs.length<8&&/^image\//.test(f.type))S.draft.imgs.push({url:URL.createObjectURL(f),name:f.name})});if(files.length){S.errs={};render()}}
  else if(el.dataset.drole){S.dash.role=el.value;render()}
  else if(el.dataset.dq){S.dash.q=el.value;render()}
  else if(el.dataset.f==='langsel'){S.lang=el.value;persist();render()}});
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.dataset.d)S.draft[el.dataset.d]=el.value;
  else if(el.dataset.otp!==undefined){el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value){const n=el.parentElement.querySelector(`[data-otp="${+el.dataset.otp+1}"]`);n&&n.focus()}}
  else if(el.name==='pw'&&el.form&&el.form.dataset.f==='reset'){const pw=el.value,sc=[pw.length>=8,/[A-Za-z]/.test(pw)&&/\d/.test(pw),/[^A-Za-z0-9]/.test(pw)||pw.length>=12].filter(Boolean).length;el.form.querySelectorAll('.str i').forEach((i,k)=>i.classList.toggle('on',sc>k))}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(S.modal){S.modal=null;S.errs={};render()}else if(S.drawer){S.drawer=null;render()}else if(S.menu){S.menu=null;render()}}
  if(e.key==='Backspace'&&e.target.dataset&&e.target.dataset.otp!==undefined&&!e.target.value){const p=e.target.parentElement.querySelector(`[data-otp="${+e.target.dataset.otp-1}"]`);p&&p.focus()}});
document.addEventListener('paste',e=>{const el=e.target;if(el.dataset&&el.dataset.otp!==undefined){const txt=(e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);if(txt.length>1){e.preventDefault();el.parentElement.querySelectorAll('[data-otp]').forEach((i,k)=>{i.value=txt[k]||''})}}});

/* boot */
S.draft=null;S.step=1;
render();
})();
</script>

</body></html>
